[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1


; 依赖库：从 Blinker 官方 GitHub 仓库拉取
lib_deps =
    https://github.com/blinker-iot/blinker-library.git